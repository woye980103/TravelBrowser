name: Build TravelBrowser APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'TravelBrowser.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q TravelBrowser.zip -d extracted

      - name: Locate Gradle project
        run: |
          FILE=$(find extracted -type f -name settings.gradle.kts -print -quit)
          if [ -z "$FILE" ]; then
            echo "Cannot find Android Gradle project"
            exit 1
          fi
          ROOT=$(dirname "$FILE")
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Found project: $ROOT"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: |
          cd "$PROJECT_ROOT"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TravelBrowser-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
